<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metropolis - Project & Task City Builder</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="isometric.css" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <!-- HUD Header -->
  <header class="hud-header">
    <div class="brand">
      <div class="brand-icon">🏙️</div>
      <div>
        <div class="brand-title">METROPOLIS</div>
        <div class="brand-subtitle">Urban Operations</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="level-badge">
        <span class="badge-icon">👑</span>
        <span class="stat-value">Level <span id="hud-level-val">1</span></span>
      </div>

      <div class="xp-container">
        <div class="stat-label" style="display: flex; justify-content: space-between;">
          <span>XP Progress</span>
          <span id="hud-xp-val">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" id="hud-xp-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="stat-box">
        <span class="stat-label">Constructed</span>
        <span class="stat-value" id="hud-completed-val">0</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">In Progress</span>
        <span class="stat-value" id="hud-active-val">0</span>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-layout">
    <div class="scene">
      <div class="world" id="world"></div>
    </div>

    <aside class="sidebar">
      <div class="card-panel">
        <div class="card-title">
          <span>Active Operations</span>
          <span style="font-size: 0.75rem; color: #82908a;">Grid 5x5</span>
        </div>
        <div id="sidebar-task-list" class="task-list">
          <!-- Populated dynamically by render.js -->
        </div>
      </div>
    </aside>
  </main>

  <!-- Add Task / Build Modal -->
  <div id="add-task-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏗️ Plan New Construction</h3>
        <button type="button" class="close-btn" id="close-add-modal">&times;</button>
      </div>
      <form id="add-task-form">
        <div class="form-group">
          <label for="task-title-input">Building Title / Project Name</label>
          <input type="text" id="task-title-input" class="form-control" placeholder="e.g. Redesign Landing Page" required />
        </div>

        <div class="form-group">
          <label for="task-details-input">Project Details (Optional)</label>
          <textarea id="task-details-input" class="form-control" rows="2" placeholder="Key goals and milestones..."></textarea>
        </div>

        <div class="form-group">
          <label>Building Scale / Priority</label>
          <div class="radio-group">
            <div class="radio-option" data-priority="low">Minor (Low)</div>
            <div class="radio-option selected" data-priority="normal">Standard (Normal)</div>
            <div class="radio-option" data-priority="high">Major (High)</div>
          </div>
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="form-group" style="flex: 1;">
            <label for="task-duration-input">Duration (Days)</label>
            <input type="number" id="task-duration-input" class="form-control" value="1" min="1" max="30" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="task-due-input">Target Completion Date</label>
            <input type="date" id="task-due-input" class="form-control" />
          </div>
        </div>

        <div class="form-group">
          <label for="task-subtasks-input">Subtasks (Comma-separated, optional)</label>
          <input type="text" id="task-subtasks-input" class="form-control" placeholder="e.g. Wireframes, Mockups, Final Review" />
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
          <button type="button" class="btn-secondary" id="cancel-add-modal">Cancel</button>
          <button type="submit" class="btn-primary">Start Construction 🚀</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Inspector Modal -->
  <div id="inspector-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="inspector-title">Building Inspector</h3>
        <button type="button" class="close-btn" id="close-inspector-modal">&times;</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <p id="inspector-details" style="font-size: 0.85rem; color: #d8d4cd; margin: 0;"></p>
        <div id="inspector-meta" style="font-size: 0.75rem; color: #82908a;"></div>

        <div style="background: #111a1e; padding: 12px; border-radius: 8px; border: 1px solid #2f414a;">
          <div style="font-size: 0.8rem; font-weight: 700; color: #f5d49a; margin-bottom: 6px;" id="inspector-progress-text">
            0% Complete
          </div>
          <div id="inspector-subtasks" class="subtask-list"></div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
        <button type="button" class="btn-danger" id="inspector-demolish-btn">Demolish 🗑️</button>
        <button type="button" class="btn-primary" id="inspector-advance-btn">⚡ Advance Work Progress</button>
      </div>
    </div>
  </div>

  <!-- Load order matters: state.js and progress.js define plain global
       functions with no module system, so later files can call them
       directly as long as they're loaded after. See AGENT.md. -->
  <script src="state.js"></script>
  <script src="progress.js"></script>
  <script src="render.js"></script>
</body>
</html>
