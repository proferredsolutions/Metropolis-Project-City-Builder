name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

workflow_dispatch:

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-actions/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project assets
        run: godot --headless --path . --import

      - name: Unit tests (progress / XP / grid)
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Smoke test (full scene, headless)
        run: godot --headless --path . res://tests/smoke.tscn
